name: Publish npm Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package_path:
        description: "Optional single package path containing package.json"
        required: false
        type: string
      dry_run:
        description: "Run npm publish with --dry-run"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (see the trailing
# comment on each `uses:` line for the tag/branch that SHA resolves to).
# Re-pin deliberately; don't restore a floating tag.

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve publish targets
        id: matrix
        env:
          INPUT_PACKAGE_PATH: ${{ github.event.inputs.package_path }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_PACKAGE_PATH:-}" ]]; then
            MATRIX="$(jq -cn --arg path "$INPUT_PACKAGE_PATH" '[{"path":$path}]')"
          else
            MATRIX="$(jq -c '.npm // []' .github/publish-packages.json)"
          fi

          COUNT="$(echo "$MATRIX" | jq 'length')"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Resolved npm publish targets: $COUNT"

  # Builds the widget runtime exactly once so every CMS package (assets_dir
  # entries in .github/publish-packages.json) ships the same bits instead of
  # each package rebuilding (or worse, shipping a stale committed copy).
  build-widget-dist:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0

      - name: Build widget dist
        run: bash widget/build.sh

      - name: Upload widget dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: widget-dist
          path: dist/*
          retention-days: 1

  publish:
    needs: [plan, build-widget-dist]
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && 'dry-run' || 'release' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install Rust + wasm target for package builds
        if: ${{ matrix.build != null && matrix.build != '' }}
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        if: ${{ matrix.build != null && matrix.build != '' }}
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0

      - name: Build package artifacts
        if: ${{ matrix.build != null && matrix.build != '' }}
        run: |
          set -euo pipefail
          ${{ matrix.build }}

      - name: Download widget dist artifact
        if: ${{ matrix.assets_dir != null && matrix.assets_dir != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: widget-dist
          path: /tmp/widget-dist

      - name: Populate package assets from widget dist
        if: ${{ matrix.assets_dir != null && matrix.assets_dir != '' }}
        run: |
          set -euo pipefail
          mkdir -p "${{ matrix.assets_dir }}"
          # widget/assets.list is the single source of truth for the widget
          # runtime file list; read it instead of hardcoding names here.
          mapfile -t WIDGET_ASSETS < <(grep -v '^#' widget/assets.list | grep -v '^?' | grep -v '^$')
          for asset in "${WIDGET_ASSETS[@]}"; do
            cp "/tmp/widget-dist/$asset" "${{ matrix.assets_dir }}/$asset"
          done
          cp widget/assets.list "${{ matrix.assets_dir }}/assets.list"
          ls -l "${{ matrix.assets_dir }}"

      - name: Validate package path
        run: test -f "${{ matrix.path }}/package.json"

      - name: Publish package to npm
        working-directory: ${{ matrix.path }}
        env:
          IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          set -euo pipefail
          if [[ "$IS_DRY_RUN" == "true" ]]; then
            npm publish --access public --provenance --dry-run
          else
            npm publish --access public --provenance
          fi

  no-packages:
    needs: plan
    if: needs.plan.outputs.count == '0'
    runs-on: ubuntu-latest
    steps:
      - name: No npm publish targets configured
        run: echo "No npm packages configured in .github/publish-packages.json (or via workflow_dispatch input)."
