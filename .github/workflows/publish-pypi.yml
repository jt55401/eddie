name: Publish PyPI Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package_path:
        description: "Optional single package path containing pyproject.toml or setup.py"
        required: false
        type: string
      dry_run:
        description: "Build and validate with twine check only"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (see the trailing
# comment on each `uses:` line for the tag/branch that SHA resolves to).
# Re-pin deliberately; don't restore a floating tag.

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve publish targets
        id: matrix
        env:
          INPUT_PACKAGE_PATH: ${{ github.event.inputs.package_path }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_PACKAGE_PATH:-}" ]]; then
            MATRIX="$(jq -cn --arg path "$INPUT_PACKAGE_PATH" '[{"path":$path}]')"
          else
            MATRIX="$(jq -c '.pypi // []' .github/publish-packages.json)"
          fi

          COUNT="$(echo "$MATRIX" | jq 'length')"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Resolved PyPI publish targets: $COUNT"

  # Builds the widget runtime exactly once so every CMS package (assets_dir
  # entries in .github/publish-packages.json) ships the same bits instead of
  # each package rebuilding (or worse, shipping a stale committed copy).
  build-widget-dist:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@96d8491b80fc26e2ab48ff0c3928c002176297c8 # 1.93.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0

      - name: Build widget dist
        run: bash widget/build.sh

      - name: Upload widget dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: widget-dist
          path: dist/*
          retention-days: 1

  publish:
    needs: [plan, build-widget-dist]
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && 'dry-run' || 'release' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download widget dist artifact
        if: ${{ matrix.assets_dir != null && matrix.assets_dir != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: widget-dist
          path: /tmp/widget-dist

      - name: Populate package assets from widget dist
        if: ${{ matrix.assets_dir != null && matrix.assets_dir != '' }}
        run: |
          set -euo pipefail
          mkdir -p "${{ matrix.assets_dir }}"
          for asset in eddie-widget.js eddie-worker.js eddie-wasm.js eddie.wasm; do
            cp "/tmp/widget-dist/$asset" "${{ matrix.assets_dir }}/$asset"
          done
          ls -l "${{ matrix.assets_dir }}"

      - name: Validate package path
        run: |
          set -euo pipefail
          if [[ ! -f "${{ matrix.path }}/pyproject.toml" && ! -f "${{ matrix.path }}/setup.py" ]]; then
            echo "Expected pyproject.toml or setup.py under ${{ matrix.path }}" >&2
            exit 1
          fi

      - name: Build distribution
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Publish distribution to PyPI
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: ${{ matrix.path }}/dist

      - name: Dry run complete
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: echo "Dry run enabled; distribution built and validated, publish step skipped."

  no-packages:
    needs: plan
    if: needs.plan.outputs.count == '0'
    runs-on: ubuntu-latest
    steps:
      - name: No PyPI publish targets configured
        run: echo "No PyPI packages configured in .github/publish-packages.json (or via workflow_dispatch input)."
