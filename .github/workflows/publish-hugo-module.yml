name: Publish Hugo Module Repo

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (see the trailing
# comment on each `uses:` line for the tag/branch that SHA resolves to).
# Re-pin deliberately; don't restore a floating tag.

jobs:
  check-secret:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check whether EDDIE_HUGO_DEPLOY_KEY is set
        id: check
        env:
          DEPLOY_KEY_SET: ${{ secrets.EDDIE_HUGO_DEPLOY_KEY != '' }}
        run: |
          echo "configured=$DEPLOY_KEY_SET" >> "$GITHUB_OUTPUT"
          if [[ "$DEPLOY_KEY_SET" != "true" ]]; then
            echo "EDDIE_HUGO_DEPLOY_KEY is not set; skipping Hugo module publish." \
              "See docs/guides/github-actions.md for setup." >&2
          fi

  publish:
    needs: check-secret
    if: needs.check-secret.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Load deploy key for eddie-hugo
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.EDDIE_HUGO_DEPLOY_KEY }}

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0

      - name: Assemble hugo-module/
        run: bash scripts/publish-hugo-module.sh

      - name: Sync and publish to jt55401/eddie-hugo
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"
          git clone "git@github.com:jt55401/eddie-hugo.git" /tmp/eddie-hugo
          rsync -av --delete --exclude='.git/' hugo-module/ /tmp/eddie-hugo/

          cd /tmp/eddie-hugo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B main
          git add -A
          if git diff --cached --quiet; then
            echo "No hugo module changes to commit."
          else
            git commit -m "Publish Hugo module from ${GITHUB_SHA}"
          fi
          git push origin main

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            git tag -a "${TAG}" -m "Release ${TAG}" || true
            git push origin "${TAG}" || true
          fi

  skipped:
    needs: check-secret
    if: needs.check-secret.outputs.configured != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report skip
        run: |
          echo "EDDIE_HUGO_DEPLOY_KEY is not configured on this repository." >&2
          echo "Hugo module publish skipped without failing the run." >&2
          echo "See docs/guides/github-actions.md for the SSH deploy-key setup." >&2
