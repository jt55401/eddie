name: Publish RubyGems Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package_path:
        description: "Optional single package path containing a .gemspec"
        required: false
        type: string
      dry_run:
        description: "Build gem only; skip gem push"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (see the trailing
# comment on each `uses:` line for the tag/branch that SHA resolves to).
# Re-pin deliberately; don't restore a floating tag.

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve publish targets
        id: matrix
        env:
          INPUT_PACKAGE_PATH: ${{ github.event.inputs.package_path }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_PACKAGE_PATH:-}" ]]; then
            MATRIX="$(jq -cn --arg path "$INPUT_PACKAGE_PATH" '[{"path":$path}]')"
          else
            MATRIX="$(jq -c '.rubygems // []' .github/publish-packages.json)"
          fi

          COUNT="$(echo "$MATRIX" | jq 'length')"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Resolved RubyGems publish targets: $COUNT"

  # Builds the widget runtime exactly once so every CMS package (assets_dir
  # entries in .github/publish-packages.json) ships the same bits instead of
  # each package rebuilding (or worse, shipping a stale committed copy).
  build-widget-dist:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0

      - name: Build widget dist
        run: bash widget/build.sh

      - name: Upload widget dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: widget-dist
          path: dist/*
          retention-days: 1

  publish:
    needs: [plan, build-widget-dist]
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && 'dry-run' || 'release' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "ruby"

      - name: Download widget dist artifact
        if: ${{ matrix.assets_dir != null && matrix.assets_dir != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: widget-dist
          path: /tmp/widget-dist

      - name: Populate package assets from widget dist
        if: ${{ matrix.assets_dir != null && matrix.assets_dir != '' }}
        run: |
          set -euo pipefail
          mkdir -p "${{ matrix.assets_dir }}"
          for asset in eddie-widget.js eddie-worker.js eddie-agent-worker.js eddie-wasm.js eddie.wasm; do
            cp "/tmp/widget-dist/$asset" "${{ matrix.assets_dir }}/$asset"
          done
          ls -l "${{ matrix.assets_dir }}"

      - name: Validate package path
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          COUNT="$(find . -maxdepth 1 -type f -name '*.gemspec' | wc -l | tr -d ' ')"
          if [[ "$COUNT" -eq 0 ]]; then
            echo "No .gemspec found in ${{ matrix.path }}" >&2
            exit 1
          fi
          if [[ "$COUNT" -gt 1 ]]; then
            echo "Multiple .gemspec files found in ${{ matrix.path }}; keep one per publish target." >&2
            exit 1
          fi

      - name: Build gem artifact
        id: build
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          GEMSPEC="$(find . -maxdepth 1 -type f -name '*.gemspec' | head -n1)"
          gem build "$GEMSPEC"
          GEM_FILE="$(find . -maxdepth 1 -type f -name '*.gem' -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2-)"
          echo "gem_file=$GEM_FILE" >> "$GITHUB_OUTPUT"

      - name: Configure RubyGems credentials via OIDC
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        uses: rubygems/configure-rubygems-credentials@bc6dd217f8a4f919d6835fcfefd470ef821f5c44 # v1.0.0

      - name: Publish gem to RubyGems.org
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          gem push "${{ steps.build.outputs.gem_file }}"

      - name: Dry run complete
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: echo "Dry run enabled; gem was built but not pushed."

  no-packages:
    needs: plan
    if: needs.plan.outputs.count == '0'
    runs-on: ubuntu-latest
    steps:
      - name: No RubyGems publish targets configured
        run: echo "No RubyGems packages configured in .github/publish-packages.json (or via workflow_dispatch input)."
